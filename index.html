<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Python Todo App</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{

    background:linear-gradient(135deg,#6C63FF,#4CAF50);
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;
}

.container{

    width:100%;
    max-width:700px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(15px);

    border-radius:20px;

    padding:35px;

    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

h1{

    text-align:center;
    color:white;

    margin-bottom:30px;

    font-size:38px;
}

form{

    display:flex;
    gap:12px;
}

input{

    flex:1;

    padding:15px;

    border:none;

    border-radius:12px;

    font-size:17px;

    outline:none;
}

button{

    padding:15px 28px;

    border:none;

    border-radius:12px;

    background:#00C853;

    color:white;

    cursor:pointer;

    font-size:16px;

    transition:.3s;
}

button:hover{

    transform:translateY(-2px);

    background:#00A844;
}

ul{

    list-style:none;

    margin-top:30px;
}

li{

    background:white;

    margin-bottom:15px;

    padding:18px;

    border-radius:12px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    box-shadow:0 8px 15px rgba(0,0,0,.1);

    transition:.3s;
}

li:hover{

    transform:translateY(-4px);
}

.task{

    display:flex;

    align-items:center;

    gap:10px;

    font-size:18px;

    color:#333;
}

.delete{

    background:#ff4d4d;

    color:white;

    text-decoration:none;

    padding:8px 15px;

    border-radius:8px;

    transition:.3s;
}

.delete:hover{

    background:#d63031;
}

.footer{

    margin-top:25px;

    text-align:center;

    color:white;

    opacity:.9;

    font-size:14px;
}

</style>

</head>

<body>

<div class="container">

<h1>🐍 Python Todo App</h1>

<form action="/add" method="POST">

<input
type="text"
name="task"
placeholder="Enter your task..."
required>

<button>Add Task</button>

</form>

<ul>

{% for todo in todos %}

<li>

<div class="task">

📌 {{ todo }}

</div>

<a class="delete" href="/delete/{{ loop.index0 }}">

🗑 Delete

</a>

</li>

{% endfor %}

</ul>

<div class="footer">

Made with ❤️ using Flask

</div>

</div>

</body>
</html>
</body>
</html>
