<!DOCTYPE html>
<html>
<head>
    <title>Python Todo App</title>

    <style>
        body{
            font-family: Arial;
            width:600px;
            margin:auto;
            margin-top:40px;
            background:#f5f5f5;
        }

        input{
            width:75%;
            padding:10px;
        }

        button{
            padding:10px;
        }

        li{
            margin:10px;
        }

        a{
            color:red;
            text-decoration:none;
        }
    </style>
</head>

<body>

<h1>🐍 Python Todo App</h1>

<form action="/add" method="POST">
    <input type="text" name="task" placeholder="Enter Task">
    <button>Add</button>
</form>

<hr>

<ul>

{% for todo in todos %}

<li>

{{todo}}

<a href="/delete/{{loop.index0}}">Delete</a>

</li>

{% endfor %}

</ul>

</body>
</html>
